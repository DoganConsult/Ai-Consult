name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (dogan-consult-backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dogan-consult-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dogan-consult-backend/package-lock.json
      - run: npm ci
      - run: node --check src/index.js
      - run: npm test --if-present

  ai-consult-react:
    name: ai-consult-react
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-consult-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-consult-react/package-lock.json
      - run: npm ci
      - run: npm run build --if-present

  sbg:
    name: sbg
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sbg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sbg/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present

  angular:
    name: angular (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dogan-ai-angular, dogan-consult-angular, doganlab-angular]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration=production

  secrets-scan:
    name: secrets-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
