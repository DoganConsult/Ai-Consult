name: dogan-ai-os
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'products/**'
      - 'migrations/**'
      - 'tools/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/dogan-ai-os.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: dogan-ai-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + quality + typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dogan_master
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dogan_master"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Quality scan (file size + forbidden tokens)
        run: pnpm run quality
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Build
        run: pnpm -r run build
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:ci_password@127.0.0.1:5432/dogan_master
          DATABASE_MIGRATION_URL: postgres://postgres:ci_password@127.0.0.1:5432/dogan_master
        run: pnpm run migrate:platform
      - name: Test
        run: pnpm -r run test

  supply-chain:
    name: SBOM + vuln scan + cosign
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          syft dir:. -o spdx-json=artifacts/dogan-ai-os.spdx.json
          syft dir:. -o cyclonedx-json=artifacts/dogan-ai-os.cdx.json
      - name: Vulnerability scan (fail on Critical/High)
        run: grype sbom:artifacts/dogan-ai-os.spdx.json --fail-on high
      - name: Sign SBOM (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/dogan-ai-os.spdx.sig \
            --output-certificate artifacts/dogan-ai-os.spdx.cert \
            artifacts/dogan-ai-os.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dogan-ai-os-supply-chain-${{ github.sha }}
          path: artifacts/
          retention-days: 90

  secrets-scan:
    name: secrets-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
