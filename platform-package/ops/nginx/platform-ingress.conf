# Gate 8 — Ingress collapse.
# Single canonical platform ingress on :8010.
#   /                  -> DOS BFF admin UI (static)
#   /api/              -> dos-platform Express BFF :3010
#   /pillars/          -> dos-platform Express BFF :3010 (NOC/SOC pillars)
#   /composer/         -> dogan-os Fastify kernel :3100 (prefix stripped)
#   /metrics           -> dogan-os :3100/metrics (Prometheus scrape target)
upstream dos_platform_bff { server 127.0.0.1:3010; }
upstream dogan_kernel    { server 127.0.0.1:3100; }

server {
    listen 8010;
    server_name platform.dogan-ai.local _;

    root /var/www/dogan-ai.com/workspace;
    index index.html;

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://dos_platform_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /pillars/ {
        proxy_pass http://dos_platform_bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dogan-Signature $http_x_dogan_signature;
        proxy_read_timeout 30s;
    }

    location /composer/ {
        rewrite ^/composer/(.*)$ /$1 break;
        proxy_pass http://dogan_kernel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dogan-Signature $http_x_dogan_signature;
        proxy_read_timeout 30s;
    }

    location = /metrics {
        proxy_pass http://dogan_kernel/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        return 200 'platform-ingress ok\n';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
}
