  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="splash-overlay" style="position:fixed;inset:0;z-index:9999;background:#1e293b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,sans-serif;text-align:center;transition:opacity 1s ease-out">
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em">DOS Platform</div>
    <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:8px">Dogan-AI-OS — Loading...</div>

  </div>
  <dos-root></dos-root>
  <style>
    @keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

    .skip-link:focus{top:0}
  </style>
  <script>
    window.addEventListener('load',function(){var s=document.getElementById('splash-overlay');if(s){s.style.opacity='0';setTimeout(function(){s.remove()},1000)}});
  </script>
