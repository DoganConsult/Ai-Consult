global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9110']
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']
  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']
  - job_name: otelcol
    static_configs:
      - targets: ['127.0.0.1:9464']
  - job_name: temporal
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: dogan-ai-os
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:3100']
        labels: { service: dogan-ai-os, pillar: composer }
