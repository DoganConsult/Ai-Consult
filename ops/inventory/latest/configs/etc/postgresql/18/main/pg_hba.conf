# DOGAN AI-OS hardened pg_hba.conf — PG18
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
hostssl all barman 127.0.0.1/32 scram-sha-256
host    all barman 127.0.0.1/32 scram-sha-256
hostssl replication barman 127.0.0.1/32 scram-sha-256
host    replication barman 127.0.0.1/32 scram-sha-256
host    all             all             ::1/128                 scram-sha-256
hostssl all             all             0.0.0.0/0               scram-sha-256
# Reject everything else
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
