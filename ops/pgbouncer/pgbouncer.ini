; Dogan AI OS - pgBouncer transaction pooler in front of PG18 (5432).
; Apps connect to 127.0.0.1:6432; pgBouncer fans in to PG18.

[databases]
dogan_master = host=127.0.0.1 port=5432 dbname=dogan_master

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres,dogan_master
stats_users = postgres,dogan_master

pool_mode = transaction
max_client_conn = 2000
default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 3
server_reset_query = DISCARD ALL
server_check_query = select 1
server_check_delay = 30
server_lifetime = 3600
server_idle_timeout = 600

ignore_startup_parameters = extra_float_digits,search_path,application_name

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0

server_tls_sslmode = disable
client_tls_sslmode = disable
