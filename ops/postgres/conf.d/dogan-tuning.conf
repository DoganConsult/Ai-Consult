# Dogan AI OS - PostgreSQL 18 production tuning.
# Host shape: 16 GB RAM, 8 vCPU, single-node primary.
# Deployed via include_dir = '/etc/postgresql/18/main/conf.d'.

# Memory
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
maintenance_work_mem = 512MB
huge_pages = try
temp_buffers = 16MB

# Connections (real app traffic flows through pgbouncer:6432)
max_connections = 200
superuser_reserved_connections = 5

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 250

# WAL / replication / archiving
wal_level = logical
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
synchronous_commit = on

# Autovacuum aggressive on hot append-only tables (auth_events, audit_log_*)
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Logging (operator visibility, not noisy)
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1000
log_line_prefix = '%m [%p] %q%u@%d/%a '

# Statement timeout safety net (per-role overrides allowed)
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 5s

# Extensions
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 10000

# JIT off for OLTP latency consistency
jit = off
